[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgnconverter"
version = "0.1.0"
description = "Authorized URL-to-Hindi dubbing pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
inference = ["faster-whisper>=1.1,<2"]
translation = [
  "sentencepiece>=0.2,<1",
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
]
worker = ["requests>=2.32,<3"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["lgnconverter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
