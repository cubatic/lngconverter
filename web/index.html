<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGN Converter – Hindi Player</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c16;color:#eef3ff}main{width:min(1050px,calc(100% - 32px));margin:32px auto}.panel{background:#111827;border:1px solid #29334a;border-radius:18px;padding:22px}h1{margin:0 0 8px}.hint{color:#aeb8cf;line-height:1.5}.row{display:grid;grid-template-columns:1fr 160px 90px auto auto;gap:10px;margin-top:18px}input,button{border-radius:10px;padding:12px;font:inherit}input{min-width:0;background:#080c16;color:inherit;border:1px solid #3b4662}button{border:0;background:#6d7cff;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.player-wrap{position:relative;margin-top:18px}.player-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}.loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#050812db;border-radius:12px;font-weight:700;z-index:2}.loader[hidden]{display:none}.spinner{width:42px;height:42px;border:4px solid #53617e;border-top-color:#91a0ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#status{margin-top:16px;padding:12px;background:#080c16;border-radius:10px;white-space:pre-wrap}#transcript{margin-top:12px;max-height:280px;overflow:auto}.segment{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 4px;border-bottom:1px solid #263047}.time{color:#8ca0c8;font-variant-numeric:tabular-nums}@media(max-width:760px){.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}
  </style>
</head>
<body><main><section class="panel">
  <h1>Hindi dubbing player</h1>
  <p class="hint">The source video stays muted. The GPU prepares Hindi dialogue and mixes it with the original background audio.</p>
  <div class="row">
    <input id="url" value="https://www.youtube.com/watch?v=4tk4uI5BzTw" aria-label="Authorized video URL">
    <input id="apiKey" type="password" placeholder="Access key" aria-label="API access key">
    <input id="start" type="number" min="0" value="0" aria-label="Start seconds">
    <button id="prepare">▶ Play</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div class="player-wrap"><div id="player"></div><div id="loader" class="loader" hidden><span class="spinner"></span><span id="loaderText">Hindi तैयार हो रही है…</span></div></div>
  <audio id="dubbed" controls hidden></audio>
  <div id="status">Enter an authorized source URL and press Prepare Hindi.</div><div id="transcript"></div>
</section></main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const e={url:document.querySelector('#url'),apiKey:document.querySelector('#apiKey'),start:document.querySelector('#start'),prepare:document.querySelector('#prepare'),stop:document.querySelector('#stop'),player:document.querySelector('#player'),dubbed:document.querySelector('#dubbed'),loader:document.querySelector('#loader'),loaderText:document.querySelector('#loaderText'),status:document.querySelector('#status'),transcript:document.querySelector('#transcript')};
function videoId(value){const url=new URL(value);return url.hostname==='youtu.be'?url.pathname.slice(1):url.searchParams.get('v')}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const terminal=new Set(['completed','failed','cancelled']);
const chunkSeconds=10,prefetchCount=3;
let player=null,chunks=[],runToken=0,playSequence=0,currentIndex=-1,playbackStarted=false,suppressPauseUntil=0,syncTimer=null,currentSourceUrl='',seekInProgress=false;
const apiReady=new Promise(resolve=>{window.onYouTubeIframeAPIReady=resolve});
e.apiKey.value=sessionStorage.getItem('lgnApiKey')||'';
const authHeaders=()=>({'x-lgn-api-key':e.apiKey.value.trim()});
function setLoading(active,text='Hindi तैयार हो रही है…'){e.loader.hidden=!active;e.loaderText.textContent=text}
function unlockAudio(){e.dubbed.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA';e.dubbed.play().then(()=>e.dubbed.pause()).catch(()=>{})}
async function apiFetch(url,options={}){
  for(let attempt=0;attempt<5;attempt++){
    try{
      const response=await fetch(url,options);
      if(![502,503,504].includes(response.status)||attempt===4)return response;
    }catch(error){
      if((options.method||'GET')!=='GET'||attempt===4)throw error;
    }
    updateStatus(`Server reconnecting… attempt ${attempt+2}/5`);await wait(750*(attempt+1));
  }
}
async function controlJob(record,action){
  if(!record.job||terminal.has(record.job.status))return;
  const response=await apiFetch(`/v1/jobs/${record.job.id}/${action}`,{method:'POST',headers:authHeaders()});
  if(response.ok)record.job=await response.json();
}
async function controlActive(action){await Promise.all(chunks.map(record=>controlJob(record,action)))}
function updateStatus(extra=''){
  const ready=chunks.filter(record=>record.job?.status==='completed').length;
  const active=chunks.filter(record=>record.job&&!terminal.has(record.job.status)).map(record=>`${record.index+1}:${record.job.status}`).join(', ');
  e.status.textContent=`Hindi chunks ready: ${ready}/${chunks.length}${active?`\nActive: ${active}`:''}${extra?`\n${extra}`:''}`;
}
async function playerState(event){
  if(event.data===YT.PlayerState.PAUSED&&Date.now()>suppressPauseUntil){e.dubbed.pause();await controlActive('pause');updateStatus('Paused — GPU work paused.')}
  if(event.data===YT.PlayerState.PLAYING){
    if(!playbackStarted){suppressPauseUntil=Date.now()+1000;player.pauseVideo();updateStatus('Please wait for Hindi, then press Play Hindi.');return}
    await controlActive('resume');if(e.dubbed.src&&e.dubbed.paused)e.dubbed.play().catch(()=>{});updateStatus();
  }
  if(event.data===YT.PlayerState.ENDED)await stopRun();
}
async function createChunk(record,sourceUrl,token){
  if(record.promise)return record.promise;
  record.promise=(async()=>{
    const response=await apiFetch('/v1/jobs',{method:'POST',headers:{'content-type':'application/json',...authHeaders()},body:JSON.stringify({source_url:sourceUrl,authorization_confirmed:true,source_language:'zh',target_language:'hi',processing_mode:'live',clip_start_seconds:record.start,clip_duration_seconds:record.duration})});
    if(!response.ok)throw new Error(await response.text());record.job=await response.json();updateStatus();
    while(!terminal.has(record.job.status)){
      await wait(2000);if(token!==runToken)throw new Error('Stopped');
      const poll=await apiFetch(`/v1/jobs/${record.job.id}`,{headers:authHeaders()});if(!poll.ok)throw new Error(await poll.text());record.job=await poll.json();updateStatus();
    }
    if(record.job.status==='failed')throw new Error(record.job.error||'Chunk processing failed');
    if(record.job.status==='cancelled')throw new Error('Stopped');
    let audioResponse=null;
    for(let attempt=0;attempt<10;attempt++){
      audioResponse=await apiFetch(`/v1/jobs/${record.job.id}/dubbed-audio`,{headers:authHeaders()});
      if(audioResponse.ok)break;if(audioResponse.status!==409)throw new Error(await audioResponse.text());
      updateStatus(`Audio upload finishing for chunk ${record.index+1}…`);await wait(1000);if(token!==runToken)throw new Error('Stopped');
    }
    if(!audioResponse?.ok)throw new Error('Dubbed audio was not produced for this chunk');record.audioUrl=URL.createObjectURL(await audioResponse.blob());
    renderTranscript(record);updateStatus();
    const next=record.index+prefetchCount;if(next<chunks.length)createChunk(chunks[next],sourceUrl,token).catch(error=>failRun(error,token));
    return record;
  })();
  return record.promise;
}
function renderTranscript(record){
  const hindi=new Map(record.job.hindi_dialogue.map(segment=>[`${segment.start}:${segment.end}`,segment.hindi_text]));
  for(const segment of record.job.transcript){
    const row=document.createElement('div'),time=document.createElement('span'),text=document.createElement('span');row.className='segment';time.className='time';
    time.textContent=`${(record.start+segment.start).toFixed(2)}–${(record.start+segment.end).toFixed(2)}`;const translated=hindi.get(`${segment.start}:${segment.end}`);
    text.textContent=translated?`${segment.text}\n${translated}`:segment.text;text.style.whiteSpace='pre-line';row.append(time,text);e.transcript.append(row);
  }
}
async function playChunk(index,token,offset=0,sequence=playSequence){
  if(token!==runToken||sequence!==playSequence)return;
  if(index>=chunks.length){setLoading(false);e.status.textContent='Hindi playback complete.';e.stop.disabled=true;e.prepare.disabled=false;playbackStarted=false;return}
  currentIndex=index;const record=chunks[index];
  if(index>0){suppressPauseUntil=Date.now()+1500;player.pauseVideo()}
  if(!record.audioUrl){setLoading(true,'अगला Hindi हिस्सा तैयार हो रहा है…');updateStatus(`Buffering chunk ${index+1}…`)}
  if(!record.audioUrl)await record.promise;if(token!==runToken||sequence!==playSequence)return;
  e.dubbed.src=record.audioUrl;e.dubbed.hidden=false;e.dubbed.currentTime=Math.max(0,Math.min(offset,record.duration-.1));
  suppressPauseUntil=Date.now()+1500;player.getIframe().style.pointerEvents='auto';player.seekTo(record.start+e.dubbed.currentTime,true);playbackStarted=true;const audioPlay=e.dubbed.play();player.playVideo();await audioPlay;setLoading(false);e.prepare.disabled=false;updateStatus(`Playing chunk ${index+1}/${chunks.length}`);
  e.dubbed.onended=()=>playChunk(index+1,token,0,sequence).catch(error=>failRun(error,token));
}
async function handleSeek(targetTime,token){
  if(seekInProgress||token!==runToken||!chunks.length)return;
  const first=chunks[0].start,last=first+chunks.reduce((sum,record)=>sum+record.duration,0);
  if(targetTime<first||targetTime>=last){suppressPauseUntil=Date.now()+1000;player.seekTo(first,true);updateStatus(`Seek between ${first.toFixed(0)}s and ${last.toFixed(0)}s.`);return}
  seekInProgress=true;const targetIndex=Math.min(chunks.length-1,Math.floor((targetTime-first)/chunkSeconds));const target=chunks[targetIndex],offset=targetTime-target.start;
  try{
    if(targetIndex===currentIndex&&target.audioUrl){e.dubbed.currentTime=Math.max(0,Math.min(offset,target.duration-.1));updateStatus(`Moved to ${targetTime.toFixed(1)}s`);return}
    const sequence=++playSequence;
    playbackStarted=false;e.dubbed.pause();suppressPauseUntil=Date.now()+1500;player.pauseVideo();player.getIframe().style.pointerEvents='none';updateStatus(`Preparing Hindi at ${targetTime.toFixed(1)}s…`);
    await createChunk(target,currentSourceUrl,token);if(targetIndex+1<chunks.length)createChunk(chunks[targetIndex+1],currentSourceUrl,token).catch(error=>failRun(error,token));
    if(token!==runToken||sequence!==playSequence)return;await playChunk(targetIndex,token,offset,sequence);
  }finally{seekInProgress=false}
}
async function stopRun(showStatus=true){
  const oldToken=runToken++;playSequence++;playbackStarted=false;currentIndex=-1;clearInterval(syncTimer);syncTimer=null;e.dubbed.pause();e.dubbed.removeAttribute('src');e.dubbed.load();
  if(player){suppressPauseUntil=Date.now()+1000;player.pauseVideo()}
  await controlActive('cancel');for(const record of chunks)if(record.audioUrl)URL.revokeObjectURL(record.audioUrl);
  chunks=[];setLoading(false);e.stop.disabled=true;e.prepare.disabled=false;if(showStatus&&oldToken)e.status.textContent='Stopped · queued GPU work cancelled.';
}
function failRun(error,token){if(token!==runToken||error.message==='Stopped')return;e.status.textContent=`Processing failed: ${error.message}`;stopRun(false)}
e.stop.addEventListener('click',()=>stopRun());
e.prepare.addEventListener('click',async()=>{unlockAudio();await stopRun(false);e.prepare.disabled=true;e.stop.disabled=false;e.transcript.replaceChildren();setLoading(true);try{
  const sourceUrl=e.url.value.trim(),id=videoId(sourceUrl),start=Number(e.start.value);currentSourceUrl=sourceUrl;
  if(!e.apiKey.value.trim())throw new Error('Access key is required');sessionStorage.setItem('lgnApiKey',e.apiKey.value.trim());
  if(!id)throw new Error('No YouTube video ID found');if(start<0)throw new Error('Start time cannot be negative');
  const token=runToken;
  await apiReady;if(player)player.destroy();
  const videoDuration=await new Promise(resolve=>{player=new YT.Player('player',{videoId:id,playerVars:{autoplay:0,mute:1,start:Math.floor(start)},events:{onReady:event=>{suppressPauseUntil=Date.now()+1000;event.target.mute();event.target.pauseVideo();event.target.getIframe().style.pointerEvents='none';resolve(event.target.getDuration())},onStateChange:playerState}})});
  if(!videoDuration||start>=videoDuration)throw new Error('Could not read video duration or start time is beyond the video');
  const duration=videoDuration-start;for(let offset=0,index=0;offset<duration;offset+=chunkSeconds,index++)chunks.push({index,start:start+offset,duration:Math.min(chunkSeconds,duration-offset),job:null,promise:null,audioUrl:null});
  e.status.textContent='Preparing first Hindi chunk…';for(let index=0;index<Math.min(prefetchCount,chunks.length);index++)createChunk(chunks[index],sourceUrl,token).catch(error=>failRun(error,token));
  syncTimer=setInterval(()=>{if(!playbackStarted||e.dubbed.paused||currentIndex<0||seekInProgress)return;const expected=chunks[currentIndex].start+e.dubbed.currentTime,target=player.getCurrentTime(),drift=target-expected;if(Math.abs(drift)>2)handleSeek(target,runToken).catch(error=>failRun(error,runToken));else if(Math.abs(drift)>.75)player.seekTo(expected,true)},500);
  await playChunk(0,token);
}catch(error){failRun(error,runToken)}});
</script></body></html>
