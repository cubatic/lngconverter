<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LGN Converter – Hindi Player</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c16;color:#eef3ff}main{width:min(1050px,calc(100% - 32px));margin:32px auto}.panel{background:#111827;border:1px solid #29334a;border-radius:18px;padding:22px}h1{margin:0 0 8px}.hint{color:#aeb8cf;line-height:1.5}.row{display:grid;grid-template-columns:1fr 110px 110px auto;gap:10px;margin-top:18px}input,button{border-radius:10px;padding:12px;font:inherit}input{min-width:0;background:#080c16;color:inherit;border:1px solid #3b4662}button{border:0;background:#6d7cff;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:wait}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:18px;background:#000}#status{margin-top:16px;padding:12px;background:#080c16;border-radius:10px;white-space:pre-wrap}#transcript{margin-top:12px;max-height:280px;overflow:auto}.segment{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:9px 4px;border-bottom:1px solid #263047}.time{color:#8ca0c8;font-variant-numeric:tabular-nums}@media(max-width:760px){.row{grid-template-columns:1fr 1fr}.row input:first-child{grid-column:1/-1}}
  </style>
</head>
<body><main><section class="panel">
  <h1>Hindi dubbing player</h1>
  <p class="hint">The source video plays muted. The backend prepares the selected range; Hindi mixed audio will be attached in the next stage.</p>
  <div class="row">
    <input id="url" value="https://www.youtube.com/watch?v=4tk4uI5BzTw" aria-label="Authorized video URL">
    <input id="start" type="number" min="0" value="0" aria-label="Start seconds">
    <input id="duration" type="number" min="1" max="180" value="30" aria-label="Duration seconds">
    <button id="prepare">Prepare Hindi</button>
  </div>
  <div id="player"></div>
  <div id="status">Enter an authorized source URL and press Prepare Hindi.</div><div id="transcript"></div>
</section></main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const e={url:document.querySelector('#url'),start:document.querySelector('#start'),duration:document.querySelector('#duration'),prepare:document.querySelector('#prepare'),player:document.querySelector('#player'),status:document.querySelector('#status'),transcript:document.querySelector('#transcript')};
function videoId(value){const url=new URL(value);return url.hostname==='youtu.be'?url.pathname.slice(1):url.searchParams.get('v')}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let player=null,currentJob=null;
const apiReady=new Promise(resolve=>{window.onYouTubeIframeAPIReady=resolve});
async function control(action){if(!currentJob)return;const response=await fetch(`/v1/jobs/${currentJob.id}/${action}`,{method:'POST'});if(response.ok)currentJob=await response.json()}
async function playerState(event){
  if(event.data===YT.PlayerState.PAUSED)await control('pause');
  if(event.data===YT.PlayerState.PLAYING&&currentJob?.status==='paused')await control('resume');
  if(event.data===YT.PlayerState.ENDED)await control('cancel');
}
e.prepare.addEventListener('click',async()=>{e.prepare.disabled=true;e.transcript.replaceChildren();try{
  const sourceUrl=e.url.value.trim(),id=videoId(sourceUrl),start=Number(e.start.value),duration=Number(e.duration.value);
  if(!id)throw new Error('No YouTube video ID found');if(start<0||duration<1||duration>180)throw new Error('Use a duration from 1 to 180 seconds');
  if(currentJob&&!['completed','failed','cancelled'].includes(currentJob.status))await control('cancel');
  await apiReady;
  if(player)player.destroy();
  player=new YT.Player('player',{videoId:id,playerVars:{autoplay:1,mute:1,start:Math.floor(start)},events:{onReady:event=>{event.target.mute();event.target.playVideo()},onStateChange:playerState}});
  e.status.textContent='Creating processing job…';
  const response=await fetch('/v1/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source_url:sourceUrl,authorization_confirmed:true,source_language:'zh',target_language:'hi',clip_start_seconds:start,clip_duration_seconds:duration})});
  if(!response.ok)throw new Error(await response.text());currentJob=await response.json();
  while(!['completed','failed','cancelled'].includes(currentJob.status)){e.status.textContent=`Job ${currentJob.id}\nStatus: ${currentJob.status}\nPause video to pause processing; resume video to continue.`;await wait(3000);currentJob=await(await fetch(`/v1/jobs/${currentJob.id}`)).json()}
  if(currentJob.status==='failed')throw new Error(currentJob.error);if(currentJob.status==='cancelled'){e.status.textContent='Playback stopped · processing cancelled.';return}
  const job=currentJob;e.status.textContent=`Analysis complete · ${job.duration_seconds.toFixed(2)}s · language ${job.detected_language}`;
  const hindi=new Map(job.hindi_dialogue.map(segment=>[`${segment.start}:${segment.end}`,segment.hindi_text]));
  for(const segment of job.transcript){const row=document.createElement('div'),time=document.createElement('span'),text=document.createElement('span');row.className='segment';time.className='time';time.textContent=`${segment.start.toFixed(2)}–${segment.end.toFixed(2)}`;const translated=hindi.get(`${segment.start}:${segment.end}`);text.textContent=translated?`${segment.text}\n${translated}`:segment.text;text.style.whiteSpace='pre-line';row.append(time,text);e.transcript.append(row)}
}catch(error){e.status.textContent=`Processing failed: ${error.message}`}finally{e.prepare.disabled=false}});
</script></body></html>
