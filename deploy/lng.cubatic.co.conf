<VirtualHost *:80>
    ServerName lng.cubatic.co

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4600/
    ProxyPassReverse / http://127.0.0.1:4600/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/lng.cubatic.co-error.log
    CustomLog ${APACHE_LOG_DIR}/lng.cubatic.co-access.log combined
</VirtualHost>
